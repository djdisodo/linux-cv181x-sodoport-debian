name: kernel-build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y \
            bc \
            bison \
            binutils-riscv64-linux-gnu \
            cpio \
            curl \
            debhelper \
            devscripts \
            device-tree-compiler \
            flex \
            gcc-riscv64-linux-gnu \
            git-buildpackage \
            kmod \
            libelf-dev \
            libssl-dev \
            pahole \
            pristine-tar \
            python3 \
            rsync \
            xz-utils

      - name: Build package
        run: |
          set -eux
          git config user.name "act"
          git config user.email "act@example.invalid"
          workdir="${RUNNER_TEMP}/linux-build"
          tarball_dir="${RUNNER_TEMP}/tarballs"
          git clone "$GITHUB_WORKSPACE" "$workdir"
          cd "$workdir"
          git checkout -b latest
          if ! git show-ref --verify --quiet refs/heads/upstream/latest; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            empty_commit="$(printf '%s\n' "Bootstrap upstream/latest" | git commit-tree "$empty_tree")"
            git branch upstream/latest "$empty_commit"
          fi
          version="$(dpkg-parsechangelog --show-field Version | sed 's/-[^-]*$//')"
          mkdir -p "$tarball_dir"
          uscan --check-dirname-level 0 --download-current-version --rename --destdir "$tarball_dir"
          gbp import-orig --no-interactive \
            --debian-branch=latest \
            --upstream-branch=upstream/latest \
            --upstream-version "$version" \
            "$tarball_dir/linux-sg2002-milkv-duo256m_${version}.orig.tar.xz"
          dpkg-buildpackage -us -uc -b -a riscv64
